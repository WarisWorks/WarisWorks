<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Waris Ruzi — AI Product Builder and Designer</title>
  <desc id="desc">A cinematic blue and violet banner for the WarisWorks GitHub profile.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060A14"/>
      <stop offset="0.48" stop-color="#0D1B3D"/>
      <stop offset="1" stop-color="#25104B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="0.52" stop-color="#818CF8"/>
      <stop offset="1" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#7C3AED" stop-opacity=".55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity=".055"/>
    </pattern>
    <filter id="blur">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="360" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1050" cy="78" r="245" fill="url(#glow)" filter="url(#blur)"/>
    <circle cx="98" cy="330" r="180" fill="#0284C7" fill-opacity=".15" filter="url(#blur)"/>

    <path d="M785 65 C920 18 1060 48 1184 142" fill="none" stroke="url(#accent)" stroke-width="2" stroke-opacity=".45"/>
    <path d="M820 92 C940 58 1057 81 1160 162" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity=".12"/>
    <circle cx="1054" cy="85" r="54" fill="none" stroke="#A78BFA" stroke-opacity=".35"/>
    <circle cx="1054" cy="85" r="30" fill="none" stroke="#38BDF8" stroke-opacity=".45"/>
    <circle cx="1054" cy="85" r="6" fill="#FFFFFF"/>
    <circle cx="1125" cy="218" r="5" fill="#C084FC"/>
    <circle cx="950" cy="255" r="4" fill="#38BDF8"/>

    <rect x="72" y="66" width="178" height="30" rx="15" fill="#FFFFFF" fill-opacity=".08" stroke="#FFFFFF" stroke-opacity=".12"/>
    <circle cx="91" cy="81" r="4" fill="#34D399"/>
    <text x="105" y="86" fill="#DDE8FF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" letter-spacing="1.6">BUILDING FROM JAPAN</text>

    <text x="72" y="168" fill="#FFFFFF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="64" font-weight="760" letter-spacing="-2">Waris Ruzi</text>
    <rect x="72" y="190" width="470" height="4" rx="2" fill="url(#accent)"/>
    <text x="72" y="232" fill="#C7D5F5" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="19" font-weight="600" letter-spacing="2.1">AI PRODUCT BUILDER · DESIGNER · DEVELOPER</text>
    <text x="72" y="272" fill="#91A4CB" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="17" letter-spacing=".6">Creating multilingual products where code meets culture.</text>

    <g transform="translate(72 304)">
      <rect width="116" height="28" rx="14" fill="#38BDF8" fill-opacity=".12" stroke="#38BDF8" stroke-opacity=".34"/>
      <text x="58" y="19" text-anchor="middle" fill="#BAE6FD" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">CODE</text>
      <rect x="128" width="116" height="28" rx="14" fill="#818CF8" fill-opacity=".12" stroke="#818CF8" stroke-opacity=".34"/>
      <text x="186" y="19" text-anchor="middle" fill="#C7D2FE" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">CULTURE</text>
      <rect x="256" width="116" height="28" rx="14" fill="#C084FC" fill-opacity=".12" stroke="#C084FC" stroke-opacity=".34"/>
      <text x="314" y="19" text-anchor="middle" fill="#E9D5FF" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="12" font-weight="650">AI</text>
    </g>
  </g>
</svg>
