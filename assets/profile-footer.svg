<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="120" viewBox="0 0 1200 120" role="img" aria-labelledby="title desc">
<title id="title">Built with curiosity. Rooted in culture.</title>
<desc id="desc">A mint and lavender signature for WarisWorks.</desc>
<defs><linearGradient id="line"><stop stop-color="#b8fbd4"/><stop offset="1" stop-color="#bcb3f8"/></linearGradient></defs>
<rect x="1" y="1" width="1198" height="118" rx="18" fill="#101820" stroke="#30413f"/>
<path d="M40 38v44m-6-38 6-6 6 6" fill="none" stroke="url(#line)" stroke-width="2"/>
<text x="68" y="57" fill="#e6efeb" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="25" font-weight="600">Built with curiosity. Rooted in culture.</text>
<text x="68" y="84" fill="#a8bbb9" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Arial,sans-serif" font-size="16">Thoughtful technology, for the people who use it.</text>
<text x="1156" y="68" text-anchor="end" fill="#b8fbd4" font-family="Consolas,monospace" font-size="19">W / W</text>
</svg>
